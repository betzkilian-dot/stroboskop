<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>engine</title></head>
<body>
<script type="module">
  import { createStrobeEngine } from '/src/lib/engine/engine.ts';

  async function load(name) {
    return await (await fetch('/tests/fixtures/' + name)).blob();
  }
  function brightCount(bmp) {
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    const g = c.getContext('2d');
    g.drawImage(bmp, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i] > 200 && d[i + 1] > 200 && d[i + 2] > 200) n++;
    return n;
  }
  const compose = { mode: 'difference', threshold: -1, featherPx: 0, region: null, fade: 0, latestOnTop: true, background: 'median' };
  const settings = (step) => ({ selection: { startIndex: 0, endIndex: 70, step, excluded: [] }, compose, captureFps: 60 });
  const o = { maxSize: 4096, showMask: true };

  (async () => {
    try {
      const result = {};
      const engine = createStrobeEngine();
      const events = [];
      engine.onProgress((d, t) => events.push([d, t]));
      const opened = await engine.open(await load('ball-60.mp4'));
      result.opened = { exact: opened.exact, frameCount: opened.info.frameCount, width: opened.info.width };

      // einfacher Render
      const r0 = await engine.render(settings(14), o);
      result.single = {
        positions: r0.positions, width: r0.width, height: r0.height, cameraMoved: r0.cameraMoved,
        autoThreshold: r0.autoThreshold, bright: brightCount(r0.image), hasMask: r0.maskOverlay !== null,
        bitmap: r0.image instanceof ImageBitmap,
      };
      result.singleProgressLast = events.at(-1);

      // zwei Renders gleichzeitig: der erste wird verdraengt
      events.length = 0;
      const [a, b] = await Promise.all([engine.render(settings(10), o), engine.render(settings(14), o)]);
      result.race = { a: a === 'superseded' ? a : 'result', positions: b === 'superseded' ? b : b.positions };
      result.raceProgressLast = events.at(-1);

      // Abbruch mitten im Render
      events.length = 0;
      const p1 = engine.render(settings(1), { ...o, showMask: false });
      await new Promise((res) => { const t = setInterval(() => { if (events.length > 1) { clearInterval(t); res(); } }, 5); setTimeout(() => { clearInterval(t); res(); }, 20000); });
      const p2 = engine.render(settings(35), { ...o, showMask: false });
      const [c, d] = await Promise.all([p1, p2]);
      result.midflight = { c: c === 'superseded' ? c : 'result', positions: d === 'superseded' ? d : d.positions };

      // Verdraengung nach Fertigstellung des Workers: nie ein Ergebnis fuer einen verdraengten Aufruf
      const tiny = { selection: { startIndex: 0, endIndex: 3, step: 1, excluded: [] }, compose, captureFps: 60 };
      const stale = []; // Ergebnisse, die nach dem zweiten render()-Aufruf noch fuer den ersten ankamen
      let finishedBefore = 0, last = 0;
      for (let i = 0; i < 8; i++) {
        let secondCalled = false;
        const first = engine.render(tiny, { maxSize: 64, showMask: false }).then((r) => {
          if (r !== 'superseded') { if (secondCalled) stale.push(i); else finishedBefore++; }
        });
        await new Promise((res) => setTimeout(res, i * 10));
        secondCalled = true;
        const second = engine.render(tiny, { maxSize: 64, showMask: false });
        await first;
        const sr = await second;
        if (sr !== 'superseded') last++;
      }
      const outcomes = { stale, last, finishedBefore };
      result.stale = outcomes;

      // Miniaturen: eine neuere Anfrage verdraengt die laufende (Ergebnis [])
      const t1 = engine.thumbnails(Array.from({ length: 60 }, (_, i) => i), 64, 'positions');
      const t2 = engine.thumbnails([0, 10, 20], 64, 'positions');
      const [r1, r2] = await Promise.all([t1, t2]);
      result.thumbAbort = { first: r1.length, second: r2.length };
      r2.forEach((b) => b.close());

      // zwei schnelle open()-Aufrufe: die Engine endet auf der zweiten Datei, keine veraltete Quelle
      {
        const f240 = await load('ball-240.mp4'), f60 = await load('ball-60.mp4');
        const o1 = engine.open(f60).then((x) => x.info.frameCount, () => 'error');
        const o2 = engine.open(f240);
        const [n1, i2] = await Promise.all([o1, o2]);
        const rr = await engine.render({ selection: { startIndex: 0, endIndex: i2.info.frameCount - 1, step: 40, excluded: [] }, compose, captureFps: 240 }, { maxSize: 64, showMask: false });
        result.twoOpens = { first: n1, second: i2.info.frameCount, renderOk: rr !== 'superseded', width: i2.info.width, renderWidth: rr === 'superseded' ? 0 : rr.width };
        if (rr !== 'superseded') rr.image.close();
        const solo = await createStrobeEngine().open(f240);
        result.twoOpens.soloFrameCount = solo.info.frameCount;
      }

      // Fehler A: open() direkt nach render() (und zweimal hintereinander) darf nicht haengen
      {
        const f240 = await load('ball-240.mp4'), f60 = await load('ball-60.mp4');
        const timeout = (ms) => new Promise((res) => setTimeout(() => res('timeout'), ms));
        const rp = engine.render(settings(1), { ...o, showMask: false }).catch(() => 'error');
        const oa = engine.open(f60).then((x) => x.info.frameCount, () => 'error');
        // ein Render, der nach dem ersten open() startet, wartet selbst auf openP -> das zweite open() darf nicht auf ihn warten
        const rp2 = engine.render(settings(1), { ...o, showMask: false }).catch(() => 'error');
        const ob = engine.open(f240).then((x) => x.info.frameCount, () => 'error');
        void rp2;
        const t0 = performance.now();
        const [ra, rb] = await Promise.all([Promise.race([oa, timeout(10000)]), Promise.race([ob, timeout(10000)])]);
        await Promise.race([rp, timeout(10000)]);
        result.openAfterRender = { a: ra, b: rb, fast: performance.now() - t0 < 10000 };
      }

      // Fehlercodes
      try { await engine.open(await load('not-a-video.mp4')); result.bad = 'no error'; }
      catch (e) { result.bad = { isVideoError: e.name === 'VideoError', code: e.code }; }

      engine.dispose();
      window.__result = result;
    } catch (e) {
      window.__result = { error: String(e && e.stack || e) };
    }
  })();
</script>
</body></html>
